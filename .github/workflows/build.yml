name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Lisanslari kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Birim testleri (engine)
        continue-on-error: true
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          cd "$DIR"
          gradle testDebugUnitTest --stacktrace
      - name: Derle
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          echo "Proje klasoru: $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ozet-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

  bundle:
    name: Release AAB (Google Play)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Lisanslari kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Keystore'u hazirla (GitHub Secrets varsa)
        env:
          KS_B64: ${{ secrets.OZET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ozet-release.jks"
            echo "OZET_KEYSTORE_FILE=$RUNNER_TEMP/ozet-release.jks" >> "$GITHUB_ENV"
            echo "Keystore bulundu: AAB imzalanacak."
          else
            echo "::warning::OZET_KEYSTORE_BASE64 secret yok; AAB IMZASIZ uretilecek (Play'e yuklenemez)."
          fi
      - name: AAB uret
        env:
          OZET_KEYSTORE_PASSWORD: ${{ secrets.OZET_KEYSTORE_PASSWORD }}
          OZET_KEY_ALIAS: ${{ secrets.OZET_KEY_ALIAS }}
          OZET_KEY_PASSWORD: ${{ secrets.OZET_KEY_PASSWORD }}
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          cd "$DIR"
          gradle bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ozet-release-aab
          path: "**/build/outputs/bundle/release/*.aab"
